server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No-op health check for Docker HEALTHCHECK / monitors.
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Cheap, low-risk hardening for a static app: no MIME sniffing, no framing (clickjacking), and no
    # Referer leaking portal URLs to other sites. NOTE: nginx discards server-level add_header lines
    # in any location that declares its own, so these are repeated in each location below.

    # Hashed build assets can be cached hard; index.html must always be revalidated so a new
    # deploy is picked up on next reload instead of being served from a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
