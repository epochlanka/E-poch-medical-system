# The E-POCH web application, served by the same container that runs the API. Every role signs in
# here and is routed to its workspace client-side, so there is one site and one port.
#
# API traffic still goes straight to port 3000, matching the app's same-host URL discovery
# (frontend/src/lib/api.ts).

server {
    listen 5173;
    server_name _;
    root /srv/epoch/app;
    index index.html;

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Hashed build assets can be cached hard; index.html must always be revalidated so a new
    # deploy is picked up on next reload instead of being served from a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Workspace routes (/admin/..., /doctor/..., /reception/..., /pharmacy/...) are client-side,
    # so anything that is not a real file falls through to the application.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
