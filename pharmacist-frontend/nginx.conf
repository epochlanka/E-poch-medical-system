server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No-op health check for Docker HEALTHCHECK / monitors.
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Hashed build assets can be cached hard; index.html must always be revalidated so a new
    # deploy is picked up on next reload instead of being served from a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
